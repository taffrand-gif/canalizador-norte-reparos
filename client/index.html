/* LCP-fast H1 placeholder — painted on first byte, hidden once React mounts.
   - Visually approximates InnovativeHero's H1 styling (white, large, bold, on a
     blue gradient) so Lighthouse reports it as the LCP element at HTML parse time.
   - position: fixed so it lives in its own stacking context (independent of the
     zone-banner / #root flow) and disappears cleanly when toggled to display:none.
   - :has() hides it as soon as #root gets a child (React has mounted).
   - .lcp-fast-h1--hidden is the JS fallback for browsers without :has() support.
   - Font sizes mirror Tailwind's text-5xl/text-7xl (48px / 72px at >=768px) so the
     placeholder takes the same vertical space as the React H1 -> no CLS swap. */
#lcp-fast-h1 {
 position: fixed;
 top: 0;
 left: 0;
 right: 0;
 z-index: 5;
 margin: 0;
 padding: 0 16px;
 text-align: center;
 color: #fff;
 font-family: 'Poppins', system-ui, -apple-system, sans-serif;
 font-weight: 900;
 font-size: 48px;

 box-sizing: border-box;
 display: flex;
 align-items: center;
 justify-content: center;
 min-height: 90vh;
}
@media (min-width: 768px) {
 #lcp-fast-h1 { font-size: 72px; }
}
#root:has(> *) ~ #lcp-fast-h1,
#lcp-fast-h1.lcp-fast-h1--hidden {
 display: none;
}
</style>

<!--
  LCP-FAST H1: Static, server-rendered H1 painted on first byte. The H1 text and
  approximate styling match what InnovativeHero renders, so Lighthouse will pick
  it up as the LCP element at HTML parse time (LCP < 200ms after TTFB) instead
  of waiting 2s+ for React to hydrate.

  HIDING RULE: Once React hydrates, the H1 in <main> takes over visually. The
  placeholder H1 is positioned absolutely on top of #root so it occupies the
  same pixel area as the eventual H1. The :has() selector hides it as soon as
  #root contains a child (which happens at React mount, before the first paint
  in most cases). For browsers without :has() support, a tiny inline script
  removes the placeholder on DOMContentLoaded.
-->
<h1 id="lcp-fast-h1" class="lcp-fast-h1">Água a Pingar? Cano Rebentado?</h1>
<script>
(function(){
  var el = document.getElementById('lcp-fast-h1');
  if (!el) return;
  function hide() {
    el.classList.add('lcp-fast-h1--hidden');
    el.setAttribute('aria-hidden', 'true');
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', hide, { once: true });
  } else {
    hide();
  }
  // Hard safety net: hide it 1500ms after first paint no matter what, so the
  // placeholder can never stay visible if hydration is broken.
  setTimeout(hide, 1500);
})();
</script>
